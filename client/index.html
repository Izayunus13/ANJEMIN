<!doctype html>

<head>
 <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
 <meta name="theme-color" content="#f9f6ff"/>
 <meta name="description" content="ANJEMIN — Anjem, Anterin Barang, Jastip, dan Lapak dalam satu tempat. Mager? ANJEMIN aja!"/>
 <title>ANJEMIN — Mager? ANJEMIN Aja!</title>
 <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
 <style>
  html{background:#fcfaff;color-scheme:light}html.dark{background:#171421;color-scheme:dark}
  html.app-booting #app,html.app-booting #modal-root,html.app-booting #toast-area{opacity:0;pointer-events:none}
 </style>
 <script>
  (()=>{
   const root=document.documentElement;
   try{const dark=localStorage.getItem('anjemin-theme')==='dark';root.classList.toggle('dark',dark);document.querySelector('[name="theme-color"]').setAttribute('content',dark?'#171421':'#f9f6ff');}catch{}
   root.classList.add('app-booting');
   let cleanupTimer;
   const reveal=()=>{
    root.classList.remove('app-booting');root.classList.add('app-revealing');
    clearTimeout(cleanupTimer);cleanupTimer=setTimeout(()=>root.classList.remove('app-revealing'),750);
   };
   const fallback=setTimeout(reveal,2000);
   window.finishAnjeminBoot=()=>{
    clearTimeout(fallback);
    requestAnimationFrame(()=>requestAnimationFrame(reveal));
   };
  })();
 </script>
 <link rel="stylesheet" href="/styles.css"/>
</head>
